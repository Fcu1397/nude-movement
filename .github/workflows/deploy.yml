name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 需在 repo Settings → Pages 將 Source 設為 "GitHub Actions"
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npx -y -p node@22.23.2 -p npm@11 -c "npm ci"

      - name: Generate static site
        env:
          # 專案頁位於 https://<user>.github.io/<repo>/，必須在建置期帶入子路徑
          NUXT_BASE_PATH: /${{ github.event.repository.name }}/
          NITRO_PRESET: github_pages
        run: npm run generate

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
